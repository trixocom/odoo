version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: odoo18_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - odoo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Odoo 18.0 Community Edition
  odoo:
    image: odoo:18.0
    container_name: odoo18_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PORT=5432
    volumes:
      # Configuración personalizada
      - ./config/odoo.conf:/etc/odoo/odoo.conf

      # Módulos personalizados (nuestro módulo)
      - ../custom_addons:/mnt/extra-addons

      # Datos persistentes de Odoo (filestore, sesiones, etc.)
      - ./data/addons:/var/lib/odoo

      # Logs (opcional, para debugging)
      - ./logs:/var/log/odoo
    ports:
      - "8069:8069"  # Puerto web de Odoo
      - "8072:8072"  # Puerto para longpolling (chat, notificaciones en tiempo real)
    networks:
      - odoo_network
    command: --
      --dev=all
      --log-level=debug

  # pgAdmin (opcional, para gestionar la base de datos visualmente)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odoo18_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@odoo.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "8080:80"
    networks:
      - odoo_network
    depends_on:
      - db

networks:
  odoo_network:
    driver: bridge

volumes:
  postgresql_data:
  odoo_data:
